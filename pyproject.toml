[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specgraph"
version = "0.1.0"
description = "Offline GraphRAG (Local Search) index builder for technical specifications (PDF/Markdown/chunks)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# NOTE: This project is designed to run fully OFFLINE on the target machine.
# Pin these in requirements.txt for a reproducible offline pip cache. graphrag is
# pinned exactly because the model-registry / config API is version sensitive.
dependencies = [
    "graphrag==3.1.0",
    "docling>=2.7.0",
    "sentence-transformers>=3.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "typer>=0.12.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "reportlab>=4.0.0",  # only used by scripts/make_sample_pdf.py
]

[project.scripts]
gridx = "specgraph.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
specgraph = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
